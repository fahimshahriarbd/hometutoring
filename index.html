<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Home Tutor Management</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- LOGIN SCREEN -->
    <section id="loginScreen" class="screen">

      <div class="login-card">

        <div class="logo">
          📚
        </div>

        <h1>Home Tutor</h1>

        <p class="subtitle">
          Tutor Management System
        </p>

        <form id="loginForm">

          <div class="input-group">
            <label for="username">
              Username
            </label>

            <input
              type="text"
              id="username"
              placeholder="Enter username"
              required
            >
          </div>


          <div class="input-group">

            <label for="password">
              Password
            </label>

            <input
              type="password"
              id="password"
              placeholder="Enter password"
              required
            >

          </div>


          <button
            type="submit"
            class="primary-button"
            id="loginButton"
          >
            Login
          </button>

          <p id="loginMessage" class="message"></p>

        </form>

      </div>

    </section>


    <!-- STUDENT SCREEN -->
    <section
      id="studentScreen"
      class="screen hidden"
    >

      <header class="topbar">

        <div>
          <h2>Student Profile</h2>
          <p id="welcomeText"></p>
        </div>

        <button
          id="logoutButton"
          class="logout-button"
        >
          Logout
        </button>

      </header>


      <div id="studentList" class="student-list">

        <div class="loading">
          Loading students...
        </div>

      </div>

    </section>

  </main>


  <script src="app.js"></script>

</body>
</html>
